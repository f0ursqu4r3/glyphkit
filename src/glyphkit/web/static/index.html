<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <title>glyphkit</title>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<!-- Preview modal -->
<div class="modal-overlay" id="previewModal" role="dialog" aria-modal="true" aria-label="Icon preview">
    <div class="modal">
        <div class="modal__header">
            <span class="modal__title" id="modalTitle"></span>
            <button class="modal__close" id="modalClose" aria-label="Close preview">&times;</button>
        </div>
        <div class="modal__preview" id="modalPreview"></div>
        <div class="modal__meta" id="modalMeta"></div>
    </div>
</div>

<div class="container">
    <!-- Header -->
    <header class="header entrance entrance-1">
        <h1>glyphkit</h1>
    </header>

    <!-- Drop zone -->
    <div class="drop-zone entrance entrance-2" id="dropZone" role="button" tabindex="0" aria-label="Upload icon image — drag and drop or click to browse">
        <div class="drop-zone__placeholder">
            <div class="drop-zone__icon"><i data-lucide="upload" size="48" stroke-width="1.5"></i></div>
            <div class="drop-zone__text">Drop your icon here or <strong>browse files</strong></div>
            <div class="drop-zone__hint">Square PNG, ideally 1024&times;1024 or larger</div>
        </div>
        <div class="image-preview" id="imagePreview">
            <img id="previewImg" alt="Icon preview">
            <div class="image-preview__badges" id="previewBadges"></div>
            <div class="warnings" id="previewWarnings"></div>
            <a class="change-image" id="changeImage">Change image</a>
        </div>
        <input type="file" id="fileInput" accept=".png,image/png">
    </div>

    <!-- Live preview strip -->
    <div class="preview-strip glass" id="previewStrip">
        <div class="preview-strip__inner">
            <div class="preview-strip__row" id="previewRow"></div>
        </div>
    </div>

    <!-- Platform selector -->
    <div class="section entrance entrance-3">
        <div class="section__header">
            <span class="section__title">Platforms</span>
            <button class="toggle-link" id="toggleAll">Select All</button>
        </div>
        <div class="platform-grid" id="platformGrid">
            <div class="platform-card glass" data-platform="ios" role="checkbox" aria-checked="false" tabindex="0">
                <div class="platform-card__icon" aria-hidden="true"><i data-lucide="smartphone" size="20"></i></div>
                <div class="platform-card__name">iOS</div>
            </div>
            <div class="platform-card glass" data-platform="android" role="checkbox" aria-checked="false" tabindex="0">
                <div class="platform-card__icon" aria-hidden="true"><i data-lucide="tablet-smartphone" size="20"></i></div>
                <div class="platform-card__name">Android</div>
            </div>
            <div class="platform-card glass" data-platform="macos" role="checkbox" aria-checked="false" tabindex="0">
                <div class="platform-card__icon" aria-hidden="true"><i data-lucide="monitor" size="20"></i></div>
                <div class="platform-card__name">macOS</div>
            </div>
            <div class="platform-card glass" data-platform="windows" role="checkbox" aria-checked="false" tabindex="0">
                <div class="platform-card__icon" aria-hidden="true"><i data-lucide="app-window" size="20"></i></div>
                <div class="platform-card__name">Windows</div>
            </div>
            <div class="platform-card glass" data-platform="web" role="checkbox" aria-checked="false" tabindex="0">
                <div class="platform-card__icon" aria-hidden="true"><i data-lucide="globe" size="20"></i></div>
                <div class="platform-card__name">Web / PWA</div>
            </div>
            <div class="platform-card glass" data-platform="linux" role="checkbox" aria-checked="false" tabindex="0">
                <div class="platform-card__icon" aria-hidden="true"><i data-lucide="terminal" size="20"></i></div>
                <div class="platform-card__name">Linux</div>
            </div>
        </div>
    </div>

    <!-- Android options -->
    <div class="android-options glass" id="androidOptions">
        <div class="android-options__inner">
            <span class="android-options__label">Android background color</span>
            <div class="android-options__color-wrap">
                <input type="color" class="android-options__color-input" id="androidBg" value="#FFFFFF">
                <span class="android-options__hex" id="androidBgHex">#FFFFFF</span>
            </div>
        </div>
    </div>

    <!-- Generate button -->
    <div class="generate-wrap entrance entrance-4">
        <button class="generate-btn" id="generateBtn" disabled>Generate Icons</button>
    </div>

    <!-- Results -->
    <div class="results" id="results">
        <div class="summary-bar glass" id="summaryBar"></div>
        <div id="resultCards"></div>
    </div>
</div>

<script src="/app.js"></script>

</body>
</html>
