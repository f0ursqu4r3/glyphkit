[project]
name = "glyphkit"
version = "0.1.0"
description = "Universal app icon generator"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "questionary>=2.0",
    "icnsutil>=1.1",
]

[project.scripts]
glyphkit = "glyphkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
ui = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
